<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash’Agreg</title>
<meta name="description" content="Flash’Agreg — cartes de révision, hors connexion, sur PC et téléphone.">
<meta name="theme-color" content="#0c1b35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flash’Agreg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button id="back" class="icon-btn" hidden aria-label="Retour"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="title"></h1>
    <div id="actions" class="topbar-actions"></div>
    <button id="account" class="icon-btn account-btn" aria-label="Compte" data-status="none"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg><span class="sync-dot"></span></button>
  </div>
</header>
<main id="app"></main>
<dialog id="modal"></dialog>
<div id="lightbox" hidden><img alt=""></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// Filet de sécurité : si l'appli ne s'affiche pas au démarrage, montrer l'erreur et proposer de réparer
// (vide les copies hors connexion de l'appli, sans toucher aux cartes enregistrées).
(function () {
  var errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message || String(e.error)); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; errors.push((r && (r.message || r.name)) || String(r)); });
  setTimeout(function () {
    var app = document.getElementById('app');
    if (!app || app.children.length) return;
    var msg = errors.length ? 'Erreur : ' + errors.join(' · ') : 'Le chargement est bloqué.';
    app.innerHTML = '<div class="empty"><h2>L’appli ne démarre pas</h2><p class="hint" id="fa-err"></p>'
      + '<p>Ferme les <b>autres onglets et fenêtres</b> Flash’Agreg, puis touche <b>Réparer</b>. Tes cartes ne sont pas effacées.</p>'
      + '<div class="row"><button class="btn primary" id="fa-repair">Réparer</button></div></div>';
    document.getElementById('fa-err').textContent = msg;
    document.getElementById('fa-repair').onclick = async function () {
      try {
        var regs = await navigator.serviceWorker.getRegistrations();
        for (var i = 0; i < regs.length; i++) await regs[i].unregister();
        var keys = await caches.keys();
        for (var j = 0; j < keys.length; j++) await caches.delete(keys[j]);
      } catch (e) { /* rien à nettoyer */ }
      location.reload();
    };
  }, 6000);
})();
</script>
<script src="cloud.js"></script>
<script src="video.js"></script>
<script src="app.js"></script>
</body>
</html>
